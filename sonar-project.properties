# SonarCloud project configuration
# Requires: SONAR_TOKEN in GitHub Secrets
# Project key format: <org>_<repo> — set up in sonarcloud.io

sonar.projectKey=Stephulz_stephulz-portfolio
sonar.organization=stephulz

# Sources
sonar.sources=src
sonar.exclusions=**/*.spec.ts, **/mock/**, **/node_modules/**, **/*.html

# TypeScript / Angular
# Explicitly separate JS and TS patterns to avoid language detection conflict
sonar.lang.patterns.js=**/*.js
sonar.lang.patterns.ts=**/*.ts,**/*.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8

# Quality gate
sonar.qualitygate.wait=true
