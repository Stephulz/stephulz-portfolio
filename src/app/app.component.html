<app-header />

<main class="main-content">
  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-bg">
      <div class="hero-gradient"></div>
    </div>

    <div class="hero-content">
      <div class="hero-text">
        <p class="hero-greeting">{{ translation.t().hero.greeting }}</p>
        <h1 class="hero-name">{{ translation.t().hero.name }}</h1>
        <h2 class="hero-subtitle">{{ translation.t().hero.subtitle }}</h2>
        <p class="hero-description">{{ translation.t().hero.description }}</p>

        <div class="hero-location">
          <span class="location-pin">📍</span>
          {{ translation.t().hero.location }}
        </div>

        <div class="hero-badges">
          <span class="badge">AZ-900</span>
          <span class="badge">DP-900</span>
          <span class="badge"
            >AZ-104 ({{ translation.t().hero.studying }})</span
          >
        </div>

        <div class="hero-actions">
          <a href="#experience" class="btn-primary">
            {{ translation.t().hero.cta }}
          </a>
          <a
            href="https://www.linkedin.com/in/stefan-s-aa7654a5/?locale=en_US"
            target="_blank"
            rel="noopener noreferrer"
            class="btn-secondary"
          >
            <ng-icon name="bootstrapLinkedin" size="24" />
            LinkedIn
          </a>
        </div>
      </div>
    </div>
  </section>

  <!-- Timeline Section -->
  <app-timeline />
</main>

<app-footer />
