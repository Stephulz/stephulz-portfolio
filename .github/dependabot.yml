version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    versioning-strategy: increase
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 10
    groups:
      angular:
        patterns:
          - "@angular/*"
        update-types:
          - minor
          - patch
      ng-icons:
        patterns:
          - "@ng-icons/*"
        update-types:
          - minor
          - patch
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "jsdom"
        update-types:
          - minor
          - patch
      linting:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "angular-eslint"
          - "typescript-eslint"
        update-types:
          - minor
          - patch
