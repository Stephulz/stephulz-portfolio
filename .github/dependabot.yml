version: 2
updates:
  # npm dependencies — single PR for all non-security updates
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    # Only 1 PR open at a time → effective cadence of ~1-2 weeks
    open-pull-requests-limit: 1
    versioning-strategy: increase
    # Wait 7 days before proposing updates to newly published package versions
    cooldown:
      default-days: 7
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One group for ALL dependencies → 1 PR with every update
      all-dependencies:
        patterns:
          - "*"
