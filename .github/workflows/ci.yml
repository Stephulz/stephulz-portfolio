            #MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD,
            #CC0-1.0, Unlicense, Python-2.0, Zlib

  gitleaks:
    name: Gitleaks (Secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0 # Gitleaks needs full git history

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@bcfb9cce635345aac9996cedc19b2de8e01b894f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonarcloud:
    name: SonarCloud (Deep SAST)
    # The SonarCloud action handles missing tokens gracefully
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # SonarCloud needs full git history

      - name: Setup Node.js
        uses: actions/setup-node@b789df37d6b7526a863bf51b65df64f3f56ffe4f # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate coverage report
        run: npm run test:coverage

      - name: SonarCloud Scan
        uses: sonarsource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1 nosemgrep:generic.secrets.security.detected-sonarqube-docs-api-key
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  Vercel:
    name: Notify Vercel
    if: always()
    needs: [test, semgrep, trivy, sonarcloud, gitleaks]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      statuses: write

    steps:
      - name: Notify Vercel
        uses: vercel/repository-dispatch/actions/status@30f760c6640485cd92f8c785ef361382555fb712 # v1
        with:
          # Must match the check name configured in Vercel Deployment Checks
          name: "Vercel - stephulz-portfolio: coverage"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Fail the job if any upstream dependency failed — this makes the
      # vercel/repository-dispatch post-action report failure to Vercel.
      - name: Propagate upstream failure
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: |
          echo "❌ Some checks failed — notifying Vercel of failure"
          echo "test:     ${{ needs.test.result }}"
          echo "semgrep:  ${{ needs.semgrep.result }}"
          echo "trivy:    ${{ needs.trivy.result }}"
          echo "gitleaks: ${{ needs.gitleaks.result }}"
          exit 1
