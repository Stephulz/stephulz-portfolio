name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@4f1f4aec02e41874fa0262ea8ff5172d7978ad1e # v7

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test:ci

      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Run build
        run: npm run build

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  semgrep:
    name: Semrep (SAST)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@4f1f4aec02e41874fa0262ea8ff5172d7978ad1e # v7

      - name: Get week number for cache key
        id: week
        run: echo "week=$(date +%V)" >> $GITHUB_OUTPUT

      - name: Cache Semgrep
        id: cache-semgrep
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v7
        with:
          path: |
            ~/.cache/pip
            ~/.semgrep/
          # Expires weekly — matches Dependabot cadence
          key: semgrep-${{ runner.os }}-${{ steps.week.outputs.week }}

      - name: Install Semgrep
        # Always runs — ~/.cache/pip only caches downloads, not the binary itself.
        # On cache hit, pip uses cached .whl files (~1 sec); on miss, downloads fresh.
        run: python3 -m pip install semgrep
      - name: Semgrep SAST
        run: semgrep scan --config auto --error

  trivy:
    name: Trivy (SCA)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@4f1f4aec02e41874fa0262ea8ff5172d7978ad1e # v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: 1

  Vercel:
    name: Notify Vercel
    if: always()
    needs: [test, semgrep, trivy]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      statuses: write

    steps:
      - name: Notify Vercel
        uses: vercel/repository-dispatch/actions/status@30f760c6640485cd92f8c785ef361382555fb712 # v1
        with:
          # Must match the check name configured in Vercel Deployment Checks
          name: "Vercel - stephulz-portfolio: coverage"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Fail the job if any upstream dependency failed — this makes the
      # vercel/repository-dispatch post-action report failure to Vercel.
      - name: Propagate upstream failure
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: |
          echo "❌ Some checks failed — notifying Vercel of failure"
          echo "test:     ${{ needs.test.result }}"
          echo "semgrep:  ${{ needs.semgrep.result }}"
          echo "trivy:    ${{ needs.trivy.result }}"
          exit 1
