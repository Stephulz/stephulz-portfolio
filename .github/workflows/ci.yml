name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@b789df37d6b7526a863bf51b65df64f3f56ffe4f # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run lint
        run: npm run lint

      # jest --coverage fails the build if the 100% threshold in jest.config.js is not met
      - name: Run tests (enforces 100% coverage threshold)
        run: npm run test:ci -- --coverage
      - name: Run build
        run: npm run build

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  semgrep:
    name: Semrep (SAST)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get week number for cache key
        id: week
        run: echo "week=$(date +%V)" >> $GITHUB_OUTPUT

      - name: Cache Semgrep
        id: cache-semgrep
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v7
        with:
          path: |
            ~/.cache/pip
            ~/.semgrep/
          # Expires weekly — matches Dependabot cadence
          key: semgrep-${{ runner.os }}-${{ steps.week.outputs.week }}

      - name: Install Semgrep
        # Always runs — ~/.cache/pip only caches downloads, not the binary itself.
        # On cache hit, pip uses cached .whl files (~1 sec); on miss, downloads fresh.
        run: python3 -m pip install semgrep
      - name: Semgrep SAST
        # Skip .github/ — CI workflow YAML is not application code
        run: semgrep scan --config auto --error --exclude .github

  trivy:
    name: Trivy (SCA)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: 1

