name: DAST

on:
  schedule:
    # Weekly scan every Sunday at 06:00 BRT
    - cron: "0 9 * * 0"
  workflow_dispatch:
    # Allow manual trigger from the Actions tab

jobs:
  zap-scan:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@f948cb8d66e25e330a23e64e3fc72a5c0018b16d # v0.15.0
        with:
          target: ${{ vars.VERCEL_URL || 'https://stephulz-portfolio.vercel.app' }}
          fail_action: true
