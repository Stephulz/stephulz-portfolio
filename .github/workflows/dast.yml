name: DAST

on:
  schedule:
    # Weekly scan every Sunday at 06:00 BRT
    - cron: "0 9 * * 0"
  workflow_dispatch:
    # Allow manual trigger from the Actions tab

jobs:
  zap-scan:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ vars.VERCEL_URL || 'https://stephulz-portfolio.vercel.app' }}
          fail_action: false
